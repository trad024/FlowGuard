    not_before: step 11, after diagnose-freeze (D39)
    target: >-
      the log lines matching the human-labelled chunk (whitespace collapsed, ANSI codes and
      carriage-return overwrites removed); logs whose chunk matches no line are excluded and
      counted
    hit: at least one quoted line inside the target
    line_metrics: precision and recall of the quoted lines against the target

# ------------------------------------------------------------------ LLM (D27, D28)
llm:
  provider: Groq (free tier)
  lanes: >-
    team members' own Groq accounts (GROQ_KEY_n in .env), one lane per independent
    organization, identical settings, each within its own free limits; seeded item-to-lane
    assignment, all of an item's calls on one lane, lane and provider recorded per call; no
    key rotation (D41). The report states that the calls ran on team members' individual
    free-tier accounts
  levels_calling: [L2, L3]      # L4 and L5 reuse L3's cached answers for identical inputs (D39)
  providers: Groq only; OpenRouter (D40) dropped (D46)
  prompt_experiments: may use a second free Groq model; validation and final runs use the pinned model (D39)
  request_budget: >-
    the log shown to the model is cut to 14,000 characters (its end kept), each of L3's 3
    examples to 1,000 and the answer to 600 tokens (D51), so one request stays under the free
    tier's 8,000 tokens per minute: the longest L3 request (the longest sampled LogChunks log
    with the 3 longest training examples) is 18,619 characters, about 6,500 prompt tokens at
    the 2.87 characters per token measured on 74 Groq calls. Line
    numbers follow the terminal view (newline-split, text after the last carriage return),
    as the LogChunks targets do (D48)
  model: openai/gpt-oss-120b     # pinned; logged per call; never mixed within one result set
  temperature: 0
  reasoning_effort: low
  repeats: >-
    3 runs on a seeded random subset of 60 items per LLM level, with the repeat index in the
    cache key (D28); 1 run elsewhere; mean and spread reported on the subset

# ------------------------------------------------------------------ calibration (D9, D45)
calibration:
  method: split conformal; the gate reads the calibrated confidence, never a self-report
  diagnose: >-
    leave-one-template-out on the 25 training and validation templates (D45): every
    template's scores come from a model that never saw it (L1 refit without it; L3's
    retrieval excludes cases of the same template; L2 has no training). The pooled scores
    are the calibration set; coverage at epsilon 0.1 is reported on each template held
    apart. Validation-only fitting is dropped
  dev_coverage: >-
    L1 67/74, L2 68/74 at a 90% target (2026-10-28, evaluation/diagnose_calibrate.py)

# ------------------------------------------------------------------ metrics
# Every rate with its count (n) and a 95% Wilson interval; event rates per hour get an exact
# Poisson interval instead.
metrics:
  H1: {primary: DSO1 recall, secondary: [false alerts per hour of normal traffic, MTTD]}
  H2: {secondary (D42): DSO2 macro-F1 on the generated corpus, also: [accuracy, cost per incident, latency per incident],
       note: L0's regex scores 82% accuracy on the generated failures (dev, 61/74)}
  H3: {primary: localization hit rate on LogChunks (D32),
       secondary: [hallucination rate (quoted lines not in the log), line-level precision and recall, macro-F1 on the corpus]}
  H4: {primary: wrong decisions (false rollbacks and wrong fixes) in collaboration scenarios}
  H5: {primary: share of incidents resolved without a human at each gate setting,
       constraint: 0 unapproved high-risk actions}
  DSO3: [bad releases caught before 100%, false rollbacks, time to rollback, change failure rate]
  DSO4: [injected criticals blocked, false-block rate]
  DSO5: [pipeline duration, failures missed vs full pipeline, time to first failure, MAE, AUC]
  DSO6: [unapproved high-risk actions, high-risk recall, escalation precision, approvals per incident]
false_alerts_per_hour:
  interval: exact Poisson (Garwood) 95% interval on the alert count, divided by the hours observed

# ------------------------------------------------------------------ comparisons and tests
alpha: 0.05
comparisons:                     # paired: same scenarios, seeds and order at every level (D10)
  H1: {levels: [L0, L1], test: exact McNemar on detected / missed}
  H2:
    methods:
      - regex (L0)
      - TF-IDF + logistic regression (L1)
      - LLM zero-shot (L2)
      - LLM + retrieval (L3)
      - fine-tuned encoder
    primary: none               # H2 is secondary (D42)
    reported_first: [L3 vs regex, L3 vs TF-IDF + LR]
    secondary: [encoder vs L3, encoder vs TF-IDF + LR, L2 vs L3]
    test: >-
      paired bootstrap of the macro-F1 difference, 10000 resamples; all five methods reported
      with their intervals
  H3: {levels: [L2, L3], test: exact McNemar on hit / miss per LogChunks log; hallucination by exact McNemar and macro-F1 by paired bootstrap (secondary)}
  H4: {levels: [L3, L4], test: exact McNemar on wrong / right decisions}
  H5: {levels: [L5 settings], test: none; Wilson interval per setting, the constraint is a count}
time_metrics: paired bootstrap intervals, 10000 resamples (MTTD, time to rollback, durations)
multiplicity: >-
  Holm correction across the confirmatory tests H1, H3 and H4 (D31, D42); H1 and H3 only if
  H4 is descriptive (D44). Secondary and per-band results uncorrected, labelled as such
per_band: every release and runtime result is also reported per intensity band (descriptive)

# ------------------------------------------------------------------ execution
run_order: >-
  Live scenarios run in a seeded random order drawn from the held-out seed (written by the
  generator as heldout/run-order.txt); every level replays the recordings in that same order.
quiet_start: >-
  No fault is injected while any L0 alert is firing (D50): before every cluster scenario
  (all families but ci and pipeline, which run on branches without the cluster), the runner
  waits until no L0 alert has fired for at least 2 minutes, for at most 15 minutes; a run
  that times out injects nothing, is recorded with valid false and is retried (up to 3
  attempts). Applies to the D44 node-stress dev check and to every Step 11 run
exclusions: >-
  Runs recorded with valid false (host slept, or alerts never quiet before injection) are
  re-run with the same spec and seed, never dropped silently; the report gives the number
  of re-runs. DSO1 counts only recordings that hold the L0 alert states; recordings made
  before they were recorded are excluded by name, not counted as misses (D50). No other
  exclusion.
