[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.1.0"
description = "Multi-agent DevOps pipeline with a human-controlled risk gate, compared against a rule-based baseline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "langgraph==1.2.15",
    "drain3==0.9.11",
    "numpy>=2,<3",
    "scikit-learn==1.7.2",
    "chromadb==1.5.9",  # L3 retrieval (Step 7)
    "onnxruntime==1.31.0",  # CPU only: the sentence model for chromadb
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.1",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["agents"]
include = ["flowguard*"]

[tool.pytest.ini_options]
testpaths = ["agents/tests", "evaluation/tests", "ci/tests", "scenarios/tests"]
pythonpath = ["agents", "evaluation", "ci", "scenarios"]
addopts = "-q"
markers = [
    "integration: needs the cluster, Docker or the network; skipped unless FLOWGUARD_INTEGRATION=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agents", "evaluation", "ci", "scenarios"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
