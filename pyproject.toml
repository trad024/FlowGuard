[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.1.0"
description = "Multi-agent DevOps pipeline with a human-controlled risk gate, compared against a rule-based baseline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["agents"]
include = ["flowguard*"]

[tool.pytest.ini_options]
testpaths = ["agents/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
