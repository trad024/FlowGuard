# DSO1 L0 baseline: static alert rules, frozen 2026-10-27 before any measurement (blueprint,
# "DSO1 L0 alert rules"). Values are copied from widely used community rules, not tuned on
# FlowGuard data. agents/tests/test_infra.py fails if a value changes; l0-alerts.test.yml checks
# with promtool that each rule fires just above its threshold and stays silent below it.
groups:
  - name: l0-runtime
    rules:
      # awesome-prometheus-alerts, "high HTTP 5xx error rate" (nginx, Traefik, HAProxy,
      # Caddy, Envoy): > 5% over 1m, for 1m
      - alert: HighErrorRatio
        expr: |
          (
            sum by (namespace) (rate(http_request_duration_seconds_count{app="podinfo",path="root",status=~"5.."}[1m]))
            /
            sum by (namespace) (rate(http_request_duration_seconds_count{app="podinfo",path="root"}[1m]))
          ) > 0.05
          and
          sum by (namespace) (rate(http_request_duration_seconds_count{app="podinfo",path="root"}[1m])) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: More than 5% of requests to / answer 5xx in {{ $labels.namespace }}
      # awesome-prometheus-alerts, "Istio latency 99 percentile": p99 > 1000 ms, for 1m
      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum by (namespace, le) (rate(http_request_duration_seconds_bucket{app="podinfo",path="root"}[1m]))) > 1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: p99 latency of / above 1 s in {{ $labels.namespace }}
      # awesome-prometheus-alerts, "Kubernetes Container oom killer": a restart in the last
      # 10m whose last termination was OOMKilled (no for)
      - alert: ContainerOOMKilled
        expr: |
          (kube_pod_container_status_restarts_total{container="podinfo"} - kube_pod_container_status_restarts_total{container="podinfo"} offset 10m >= 1)
          and ignoring (reason)
          min_over_time(kube_pod_container_status_last_terminated_reason{container="podinfo",reason="OOMKilled"}[10m]) == 1
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
      # awesome-prometheus-alerts, "Kubernetes pod crash looping": CrashLoopBackOff within
      # 5m, for 2m (kubernetes-mixin's KubePodCrashLooping waits 15m; the shorter one is kept)
      - alert: PodCrashLooping
        expr: |
          max_over_time(kube_pod_container_status_waiting_reason{container="podinfo",reason="CrashLoopBackOff"}[5m]) >= 1
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
      # awesome-prometheus-alerts, "Container High Memory usage": working set > 80% of the
      # limit, for 2m (the limit from kube-state-metrics, as cAdvisor's is not scraped)
      - alert: ContainerHighMemory
        expr: |
          sum by (namespace, pod) (container_memory_working_set_bytes{container="podinfo"})
          /
          sum by (namespace, pod) (kube_pod_container_resource_limits{container="podinfo",resource="memory"} > 0)
          > 0.8
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} uses more than 80% of its memory limit"
