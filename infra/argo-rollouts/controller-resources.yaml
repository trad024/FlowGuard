# The upstream Deployment sets no CPU or memory values; cap it for the laptop budget.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-rollouts
spec:
  template:
    spec:
      containers:
        - name: argo-rollouts
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
              ephemeral-storage: 1Gi
