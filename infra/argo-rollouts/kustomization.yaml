# Argo Rollouts controller, official release manifest pinned to v1.10.1
# (sha256 149148429a6f8258b789003ffb9bc6698a526d611ecb1b185624217cf51bae7f).
# Applied on its own and server-side: the CRDs are larger than the 256 KiB annotation that
# client-side apply writes.  kubectl apply --server-side -k infra/argo-rollouts
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-rollouts
resources:
  - namespace.yaml
  - https://github.com/argoproj/argo-rollouts/releases/download/v1.10.1/install.yaml
patches:
  - path: controller-resources.yaml
