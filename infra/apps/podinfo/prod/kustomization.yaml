apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../base
labels:
  - pairs:
      flowguard/environment: prod
    includeSelectors: false
    includeTemplates: true
patches:
  - target:
      kind: Service
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30899
