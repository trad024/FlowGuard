apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../base
labels:
  - pairs:
      flowguard/environment: staging
    includeSelectors: false
    includeTemplates: true
patches:
  # Run-time fault settings (D19 amended) for runtime-incident scenarios: staging only.
  # The admin endpoint is on the metrics port, which no Service exposes.
  - target:
      kind: Rollout
      name: podinfo
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: PODINFO_FAULT_ADMIN
            value: "true"
