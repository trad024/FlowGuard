# Demo service as an Argo Rollout. Without a traffic router the canary weight is set by replica
# counts behind the one Service, so 10 replicas make 20% and 50% exact (2 and 5 canary pods).
# Each analysis step runs the frozen L0 template (analysis-l0.yaml), the DSO3 baseline.
# Metrics and liveness use podinfo's separate metrics port (9797), which has none of the fault
# middleware: a bad version's injected errors must not hide its own metrics or restart its pods.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  replicas: 10
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: podinfo
  strategy:
    canary:
      # Up to 2 extra pods while switching, never below 10 ready pods
      maxSurge: "20%"
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause: {duration: 30s} # canary pods take traffic before the first measurement
        - analysis:
            templates:
              - templateName: podinfo-l0
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
              - name: namespace
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
        - setWeight: 50
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: podinfo-l0
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
              - name: namespace
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
        - setWeight: 100
  template:
    metadata:
      labels:
        app: podinfo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9797"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command:
            - ./podinfo
            - --port=9898
            - --level=info
            - --port-metrics=9797
          ports:
            - name: http
              containerPort: 9898
            - name: metrics
              containerPort: 9797
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  type: NodePort
  selector:
    app: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: http
      nodePort: 30898
