name: checks

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz | tar xz
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Render and validate
        # Rollout and AnalysisTemplate schemas come from the community CRD catalog
        run: |
          ./kustomize build infra | ./kubeconform -strict -summary -kubernetes-version 1.31.5 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
          # Upstream CRDs: kubeconform ships no schema for CustomResourceDefinition itself
          ./kustomize build infra/argo-rollouts | ./kubeconform -strict -summary -kubernetes-version 1.31.5 \
            -skip CustomResourceDefinition -
      - name: Check and unit-test the DSO1 L0 alert rules
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz | tar xz
          cd infra/monitoring/prometheus
          ../../../prometheus-3.5.0.linux-amd64/promtool check rules l0-alerts.yml
          ../../../prometheus-3.5.0.linux-amd64/promtool test rules l0-alerts.test.yml
